---
##############################################
# Install base packages
##############################################
- name: Install base packages
  apt:
    name:
      - nginx
      - ca-certificates
    state: present
    update_cache: true

##############################################
# Ensure nginx is running
##############################################
- name: Ensure nginx is running and enabled
  service:
    name: nginx
    state: started
    enabled: true

##############################################
# Static website
##############################################
- name: Create web root
  file:
    path: /var/www/html
    state: directory
    mode: "0755"
    
- name: Deploy static index page (UTF-8 safe)
  copy:
    dest: /var/www/html/index.html
    mode: "0644"
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Hackwell Inc</title>
      </head>
      <body>
        <h1>Welcome to Hackwell Inc — we deploy like pros 🚀</h1>
      </body>
      </html>


##############################################
# Nginx config (optional explicit config)
##############################################
- name: Ensure default nginx site is enabled
  file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  notify: Reload nginx
